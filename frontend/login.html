<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - StudentHub</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
        .login-card{background:var(--panel);padding:28px;border-radius:12px;box-shadow:var(--shadow);width:360px}
        .login-card h2{margin:0 0 12px}
        .login-card input{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;background:transparent;color:var(--text)}
        .login-actions{display:flex;gap:8px;justify-content:flex-end}
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <h2>Teacher Login</h2>
        <form id="loginForm">
            <label>Username
                <input id="username" type="text" required autocomplete="username" />
            </label>
            <label>Password
                <input id="password" type="password" required autocomplete="current-password" />
            </label>
            <div class="login-actions">
                <button type="submit" class="primary-btn">Login</button>
            </div>
        </form>
    </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    if (u === 'User' && p === '12345') {
        try { localStorage.setItem('auth','1'); } catch(e){}
        window.location.href = '/';
    } else {
        alert('Invalid credentials');
    }
});

// Apply saved theme or system preference
(function(){
    try{
        const saved = localStorage.getItem('theme');
        if (saved) {
            if (saved === 'dark') document.documentElement.classList.add('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    } catch(e){}
})();
</script>
</body>
</html>
